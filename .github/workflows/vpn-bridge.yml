name: VPN isolated managed bridge acceptance

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-bridge.yml'
      - 'bin/proxypilot'
      - 'app/build.sh'
      - 'app/build-joint-release.sh'
      - 'app/main.swift'
      - 'app/VPNConfiguration.swift'
      - 'app/VPNBridge*.swift'
      - 'app/vpn-helper/VPNApplicationSpec.swift'
      - 'app/vpn-helper/VPNTunnelStateStore.swift'
      - 'app/vpn-helper/VPNDNSContinuousClock.swift'
      - 'tests/test_managed_bridge_namespace.py'
      - 'tests/test_power.py'
      - 'tests/test_vpn_bridge*.py'
      - 'tests/test_vpn_helper_listener.py'
      - 'tests/vpn_helper_service.swift'
      - 'tests/vpn_readiness_checks.swift'
      - 'tests/vpn_bridge_bypass_checks.swift'
      - 'tests/vpn_bridge_protection_checks.swift'
      - 'tests/vpn_bridge_protection_api_checks.swift'
      - 'tests/vpn_bridge_api_native_worker.swift'
      - 'tests/vpn_bridge_worker*'
      - 'tests/vpn_bridge_gost_configuration_checks.swift'
      - 'tests/test_cli_selection.py'
      - 'tests/test_vpn_joint_release_builder.py'
      - 'tests/test_update_quiescence.py'
      - 'tests/update_quiescence_checks.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Isolated managed bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ordinary user and shell syntax
        run: |
          test "$(id -u)" -ne 0
          /bin/zsh -n bin/proxypilot
          /bin/zsh -n app/build.sh
      - name: Private bridge processes, handoff, CLI selection and update retention
        run: PYTHONPATH=tests python3 -m unittest test_managed_bridge_namespace test_power test_vpn_bridge_handoff test_cli_selection test_vpn_joint_release_builder test_vpn_bridge_bypass test_vpn_bridge_protection test_vpn_bridge_protection_api test_vpn_bridge_api_native test_vpn_bridge_worker test_vpn_bridge_gost_configuration test_update_quiescence -v
      - name: Authenticated root bootstrap and durable App cache
        run: |
          PYTHONPATH=tests python3 -m unittest \
            test_vpn_helper_listener.VPNHelperListenerTests.test_boot_cache_union_is_durable_before_activation \
            test_vpn_helper_listener.VPNHelperListenerTests.test_boot_cache_survives_final_root_refusal_and_runtime_is_retired_once \
            test_vpn_helper_listener.VPNHelperListenerTests.test_boot_cache_configuration_change_retires_once_before_return -v
