name: VPN complete system rescue acceptance

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-system-rescue.yml'
      - 'tests/test_vpn_rescue_system_vm.py'
      - 'tests/test_vpn_rescue_system_materials.py'
      - 'tests/test_vpn_rescue_system_diagnostics.py'
      - 'tests/test_vpn_engine_build.py'
      - 'tests/vpn_rescue_system_*.swift'
      - 'tests/vpn_rescue_package_signer.swift'
      - 'tests/fixtures/vpn-frozen139-production-sources.sha256'
      - 'app/vpn-helper/**'
      - 'app/vpn-rescue/**'
      - 'app/vpn-engine/**'
      - 'app/vpn-package/**'
      - 'app/VPNConfiguration.swift'
      - 'app/VPNProfileImporter.swift'
      - 'app/vpn-release-key.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-rescue:
    name: Real Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fast signed fixture, engine continuity and source extraction checks
        run: PYTHONPATH=tests python3 -m unittest test_vpn_rescue_system_materials test_vpn_rescue_system_diagnostics test_vpn_engine_build -v
      - name: Build production artifacts with synthetic trust as ordinary user
        env:
          PROXYPILOT_VM_SYSTEM_RESCUE_BUILD: '1'
        run: python3 tests/test_vpn_rescue_system_vm.py --build "$RUNNER_TEMP/system-rescue"
      - name: Refuse a different retained rescue capsule
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_preinstall_preserves_different_valid_retained_rescue -v
      - name: Recover completed service and broker phase6 while enabled
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_real_installer_recovers_completed_service_and_broker_phase6_desired_on -v
      - name: Repair pending update while disabled
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_real_installer_repairs_pending137_through139_to_c_desired_off -v
      - name: Repair pending update while enabled
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_real_installer_repairs_pending137_through139_to_c_desired_on -v
      - name: Resume identical retained rescue and reinstall idempotently
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_real_installer_resumes_identical_retained_rescue_desired_off -v
      - name: Ordinary owner updates repaired C to D while disabled
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_z_ordinary_owner_updates_repaired_c_desired_off -v
      - name: Ordinary owner updates repaired C to D while enabled
        run: sudo -n env GITHUB_ACTIONS=true PROXYPILOT_VM_SYSTEM_RESCUE_TESTS=1 PROXYPILOT_SYSTEM_RESCUE_FIXTURE="$RUNNER_TEMP/system-rescue" PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_system_vm.VPNRescueSystemVMTests.test_z_ordinary_owner_updates_repaired_c_desired_on -v
      - name: Preserve reviewed engine build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-system-rescue-build-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/system-rescue/EngineBuild/*/build.log
          if-no-files-found: ignore
          retention-days: 3
