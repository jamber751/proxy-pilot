name: VPN exact-address UDP/TCP forwarding and owner death

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-exact-route-packets.yml'
      - 'tests/test_vpn_exact_route_packet_vm.py'
      - 'tests/vpn_exact_route_packet_vm.c'
      - 'tests/vpn_exact_route_pair_vm.c'
      - 'tests/vpn_dns_utun_vm_support.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packets:
    name: Unbound UDP/TCP and owned interface SIGKILL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Both architectures compile; ordinary host refuses all live calls
        run: PYTHONPATH=tests python3 -m unittest test_vpn_exact_route_packet_vm test_vpn_exact_route_pair_vm -v
      - name: Actual UDP/TCP packets in exclusive utuns in disposable root VM only
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true PROXYPILOT_VM_EXACT_ROUTE_PACKETS=1 \
            PROXYPILOT_VM_DNS_UTUN_TESTS=1 RUNNER_TEMP="$RUNNER_TEMP" \
            /usr/bin/python3 tests/test_vpn_exact_route_packet_vm.py --acceptance
