name: VPN GOST atomic policy candidate

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-gost-atomic-candidate.yml'
      - 'app/vpn-bridge/**'
      - 'app/vpn-system-resolver/**'
      - 'tests/test_vpn_gost_native_resolver_vm.py'
      - 'tests/test_vpn_gost_system_resolver_vm.py'
      - 'tests/vpn_gost_system_dns_owner.swift'
      - 'tests/test_vpn_dns_resolver_vm.py'
      - 'tests/test_vpn_system_resolver_worker.py'
      - 'tests/test_vpn_signed_bridge_candidate.py'
      - 'tests/test_vpn_gost_atomic_preparation.py'
      - 'tests/test_vpn_gost_atomic_vm.py'
      - 'tests/test_vpn_bridge_gost_vm.py'
      - 'tests/vpn_bridge_api_native_worker.swift'
      - 'app/VPNBridgeProtection.swift'
      - 'app/VPNBridgeProtectionAPI.swift'
      - 'app/VPNBridgeGOSTConfiguration.swift'
      - 'app/VPNBridgeWorker*.swift'
      - 'app/VPNSystemResolverWorker.swift'
      - 'tests/test_vpn_system_resolver_owner.py'
      - 'tests/vpn_system_resolver_worker_checks.swift'
      - 'tests/vpn_system_resolver_fake.c'
      - 'tests/test_vpn_bridge_worker_gost_vm.py'
      - 'tests/vpn_bridge_worker_gost_vm.swift'
      - 'app/VPNConfiguration.swift'
      - 'app/vpn-helper/VPNDNSContinuousClock.swift'
      - 'tests/test_vpn_gost_resolver_vm.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Atomic positive bypass source and runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Includes cold GOST builds, native worker builds and real proxy/API/TLS canaries.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Refusal and interleaving checks without sockets or GOST execution
        run: PYTHONPATH=tests python3 -m unittest test_vpn_system_resolver_owner test_vpn_bridge_worker_gost_vm test_vpn_signed_bridge_candidate test_vpn_gost_atomic_preparation test_vpn_gost_atomic_vm test_vpn_bridge_gost_vm test_vpn_gost_native_resolver_vm test_vpn_gost_system_resolver_vm -v
      - name: Fetch pinned module into a private disposable namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          umask 077
          work="$RUNNER_TEMP/proxypilot-atomic-source"
          mkdir -m 700 "$work"
          {
            echo 'GOENV=off'
            echo 'GOWORK=off'
            echo 'GOTOOLCHAIN=local'
            echo "GOMODCACHE=$work/mod"
            echo "GOPATH=$work/gopath"
            echo "GOCACHE=$work/cache"
            echo 'GOPROXY=https://proxy.golang.org'
            echo 'GOSUMDB=sum.golang.org'
          } >> "$GITHUB_ENV"
          GOENV=off GOWORK=off GOTOOLCHAIN=local GOMODCACHE="$work/mod" \
            GOPATH="$work/gopath" GOCACHE="$work/cache" \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go mod download -json github.com/go-gost/x@v0.8.1 > "$work/download.json"
          python3 app/vpn-bridge/prepare_atomic_gost.py "$work/download.json" "$work/candidate"
      - name: Actual API handler and concurrent readers under Go race detector
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          cd "$RUNNER_TEMP/proxypilot-atomic-source/candidate/x"
          go test -race ./registry ./api ./config/parsing/resolver -run '^TestProxyPilot' -count=1 -v
      - name: Build pinned candidate without installing or running it
        shell: bash
        run: |
          set -euo pipefail
          python3 app/vpn-bridge/build_atomic_gost.py \
            "$RUNNER_TEMP/proxypilot-atomic-source/build" \
            --cache-root "$RUNNER_TEMP/proxypilot-atomic-source"
      - name: Reproducible signed Universal worker candidate without execution
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/proxypilot-atomic-source/build/gost-universal"
          first="$RUNNER_TEMP/proxypilot-atomic-source/signed-first"
          second="$RUNNER_TEMP/proxypilot-atomic-source/signed-second"
          python3 app/vpn-bridge/sign_atomic_gost.py "$source" "$first"
          python3 app/vpn-bridge/sign_atomic_gost.py "$source" "$second"
          cmp "$first/gost" "$second/gost"
          cmp "$first/verification.json" "$second/verification.json"
      - name: Production owned worker startup, live code authentication and parent death
        shell: bash
        env:
          PROXYPILOT_VM_GOST_RESOLVER_TESTS: '1'
          PROXYPILOT_VM_GOST_ATOMIC_TESTS: '1'
          PROXYPILOT_VM_BRIDGE_WORKER_GOST: '1'
        run: |
          set -euo pipefail
          export PROXYPILOT_VM_GOST_SIGNED_BINARY="$RUNNER_TEMP/proxypilot-atomic-source/signed-first/gost"
          python3 tests/test_vpn_bridge_worker_gost_vm.py --acceptance
      - name: Real HTTP and SOCKS through owned endpoints and private Unix API
        shell: bash
        env:
          PROXYPILOT_VM_GOST_RESOLVER_TESTS: '1'
          PROXYPILOT_VM_GOST_ATOMIC_TESTS: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          export PROXYPILOT_VM_GOST_ATOMIC_BINARY="$RUNNER_TEMP/proxypilot-atomic-source/build/gost-$(uname -m)"
          python3 tests/test_vpn_gost_atomic_vm.py --acceptance
      - name: Production Swift publisher exchanges with authenticated candidate GOST
        shell: bash
        env:
          PROXYPILOT_VM_GOST_RESOLVER_TESTS: '1'
          PROXYPILOT_VM_GOST_ATOMIC_TESTS: '1'
          PROXYPILOT_VM_BRIDGE_GOST_TESTS: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          export PROXYPILOT_VM_GOST_ATOMIC_BINARY="$RUNNER_TEMP/proxypilot-atomic-source/build/gost-$(uname -m)"
          python3 tests/test_vpn_bridge_gost_vm.py --acceptance
      - name: Pure native worker checks and private two-architecture build
        run: |
          PYTHONPATH=tests python3 -m unittest test_vpn_system_resolver_worker -v
          python3 app/vpn-system-resolver/build.py "$RUNNER_TEMP/native-system-resolver"
      - name: Candidate GOST uses TLS-pinned native worker and refuses bad CA or password
        shell: bash
        env:
          PROXYPILOT_VM_GOST_RESOLVER_TESTS: '1'
          PROXYPILOT_VM_GOST_ATOMIC_TESTS: '1'
          PROXYPILOT_VM_NATIVE_SYSTEM_RESOLVER_TESTS: '1'
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          export PROXYPILOT_VM_GOST_ATOMIC_BINARY="$RUNNER_TEMP/proxypilot-atomic-source/build/gost-$(uname -m)"
          export PROXYPILOT_VM_SYSTEM_RESOLVER_BINARY="$RUNNER_TEMP/native-system-resolver/system-resolver-$(uname -m)"
          python3 tests/test_vpn_gost_native_resolver_vm.py --acceptance
      - name: Native worker follows an owned macOS DNS scope for A and AAAA over UDP and TCP
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true PROXYPILOT_VM_GOST_SYSTEM_RESOLVER_TESTS=1 \
            PROXYPILOT_VM_GOST_RESOLVER_TESTS=1 PROXYPILOT_VM_GOST_ATOMIC_TESTS=1 \
            PROXYPILOT_VM_NATIVE_SYSTEM_RESOLVER_TESTS=1 RUNNER_TEMP="$RUNNER_TEMP" PATH="$PATH" \
            PROXYPILOT_VM_GOST_ATOMIC_BINARY="$RUNNER_TEMP/proxypilot-atomic-source/build/gost-$(uname -m)" \
            PROXYPILOT_VM_SYSTEM_RESOLVER_BINARY="$RUNNER_TEMP/native-system-resolver/system-resolver-$(uname -m)" \
            /usr/bin/python3 tests/test_vpn_gost_system_resolver_vm.py --native-acceptance
      - name: Record canonical native candidate public identity
        if: matrix.os == 'macos-26'
        run: python3 -c 'import json,os; print(json.dumps(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"native-system-resolver","verification.json")))["universal"],sort_keys=True))'
      - name: Preserve canonical native candidate for isolated consumers
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: native-resolver-canonical-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-system-resolver/system-resolver
            ${{ runner.temp }}/native-system-resolver/verification.json
          if-no-files-found: error
          retention-days: 3
