name: VPN GOST atomic policy candidate source checks

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-gost-atomic-candidate.yml'
      - 'app/vpn-bridge/**'
      - 'tests/test_vpn_gost_atomic_preparation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Atomic positive bypass source regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Refusal and interleaving checks without sockets or GOST execution
        run: python3 -m unittest discover -s tests -p test_vpn_gost_atomic_preparation.py -v
      - name: Fetch pinned module into a private disposable namespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          umask 077
          work="$RUNNER_TEMP/proxypilot-atomic-source"
          mkdir -m 700 "$work"
          {
            echo 'GOENV=off'
            echo 'GOWORK=off'
            echo 'GOTOOLCHAIN=local'
            echo "GOMODCACHE=$work/mod"
            echo "GOPATH=$work/gopath"
            echo "GOCACHE=$work/cache"
            echo 'GOPROXY=https://proxy.golang.org'
            echo 'GOSUMDB=sum.golang.org'
          } >> "$GITHUB_ENV"
          GOENV=off GOWORK=off GOTOOLCHAIN=local GOMODCACHE="$work/mod" \
            GOPATH="$work/gopath" GOCACHE="$work/cache" \
            GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            go mod download -json github.com/go-gost/x@v0.8.1 > "$work/download.json"
          python3 app/vpn-bridge/prepare_atomic_gost.py "$work/download.json" "$work/candidate"
      - name: Actual API handler and concurrent readers under Go race detector
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          cd "$RUNNER_TEMP/proxypilot-atomic-source/candidate/x"
          go test -race ./registry ./api -run '^TestProxyPilot' -count=1 -v
