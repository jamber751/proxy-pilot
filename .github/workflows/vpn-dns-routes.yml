name: VPN isolated scoped DNS route custody

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-dns-routes.yml'
      - 'app/vpn-helper/VPNRoute*.swift'
      - 'app/vpn-helper/VPNDarwinRouteSocket.swift'
      - 'app/vpn-helper/VPNDomainNetworkPlan.swift'
      - 'app/vpn-helper/VPNDNSPlan.swift'
      - 'app/vpn-helper/VPNBoundDNSUpstreamSocket.swift'
      - 'app/vpn-helper/VPNDNSUpstreamExchange.swift'
      - 'app/vpn-helper/VPNDNSAnswerCodec.swift'
      - 'app/vpn-helper/VPNDNSAnswerRelease.swift'
      - 'tests/test_vpn_scoped_dns_route_custody.py'
      - 'tests/vpn_scoped_dns_route_custody_checks.swift'
      - 'tests/test_vpn_domain_network_plan.py'
      - 'tests/vpn_domain_network_plan_checks.swift'
      - 'tests/test_vpn_bound_dns_upstream_socket.py'
      - 'tests/vpn_bound_dns_upstream_socket_checks.swift'
      - 'tests/test_vpn_dns_answer_release.py'
      - 'tests/vpn_dns_answer_release_checks.swift'
      - 'tests/test_vpn_ordinary_route_lookup.py'
      - 'tests/vpn_ordinary_route_lookup_checks.swift'
      - 'tests/test_vpn_route_socket_write_miss.py'
      - 'tests/vpn_route_socket_write_miss_checks.swift'
      - 'tests/test_vpn_dns_upstream_exchange.py'
      - 'tests/vpn_dns_upstream_exchange_checks.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    name: Pure scoped custody and helper build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private fake interfaces and route tables; no network operations
        run: PYTHONPATH=tests python3 -m unittest test_vpn_scoped_dns_route_custody test_vpn_domain_network_plan test_vpn_bound_dns_upstream_socket test_vpn_dns_answer_release test_vpn_ordinary_route_lookup test_vpn_route_socket_write_miss test_vpn_dns_upstream_exchange -v
      - name: Genuine universal helper compile and signature verification only
        run: zsh app/vpn-helper/build.sh "$RUNNER_TEMP/scoped-dns-helper"
