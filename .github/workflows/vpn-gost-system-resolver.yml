name: VPN GOST through native system DNS

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-gost-system-resolver.yml'
      - 'app/vpn-system-resolver/**'
      - 'tests/test_vpn_system_resolver_worker.py'
      - 'tests/test_vpn_gost_system_resolver_vm.py'
      - 'tests/vpn_gost_system_resolver_fixture.cjs'
      - 'tests/vpn_gost_system_dns_owner.swift'
      - 'tests/test_vpn_dns_resolver_vm.py'
      - 'tests/test_vpn_gost_resolver_vm.py'
      - 'tests/test_vpn_gost_grpc_resolver_vm.py'
      - 'tests/vpn_gost_grpc_resolver_fixture.cjs'
      - 'tests/vpn_gost_resolver_vm_checks.py'
      - 'make-dmg.sh'
      - 'bin/proxypilot'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolver:
    name: System DNS through owned Unix RPC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Pure native resolver worker handlers and private two-architecture build
        run: |
          PYTHONPATH=tests python3 -m unittest test_vpn_system_resolver_worker -v
          python3 app/vpn-system-resolver/build.py "$RUNNER_TEMP/native-system-resolver"
      - name: Pure contract and refusal guards without network or GOST execution
        run: |
          node --check tests/vpn_gost_grpc_resolver_fixture.cjs
          node --check tests/vpn_gost_system_resolver_fixture.cjs
          PYTHONPATH=tests python3 -m unittest test_vpn_gost_system_resolver_vm test_vpn_gost_resolver_vm test_vpn_gost_grpc_resolver_vm -v
      - name: Fetch the release archive pinned by the shipped bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ge 500
          umask 077
          work="$RUNNER_TEMP/gost-resolver-contract"
          mkdir -m 700 "$work"
          case "$(uname -m)" in
            arm64)
              arch=arm64
              expected=e54f6c22e81c00650adfbbb23317c74a4dca9b9b73fa28cfa150f5559cc3ff2e
              ;;
            x86_64)
              arch=amd64
              expected=0892485bd94e37b67a1f1d0d2372ed12d7dc0f1bc763d56177a0c0ee734855e6
              ;;
            *) exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 180 \
            --output "$work/release.tar.gz" \
            "https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_darwin_${arch}.tar.gz"
          actual=$(shasum -a 256 "$work/release.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf "$work/release.tar.gz" -C "$work" gost
          test -f "$work/gost" && test ! -L "$work/gost"
          chmod 700 "$work/gost"
      - name: Root owns temporary DNS scope; unchanged GOST and clients stay ordinary
        run: |
          sudo -n /usr/bin/env GITHUB_ACTIONS=true PROXYPILOT_VM_GOST_SYSTEM_RESOLVER_TESTS=1 \
            PROXYPILOT_VM_GOST_RESOLVER_TESTS=1 RUNNER_TEMP="$RUNNER_TEMP" PATH="$PATH" \
            PROXYPILOT_VM_GOST_BINARY="$RUNNER_TEMP/gost-resolver-contract/gost" \
            /usr/bin/python3 tests/test_vpn_gost_system_resolver_vm.py --acceptance
