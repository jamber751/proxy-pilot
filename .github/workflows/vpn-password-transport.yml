name: VPN authenticated password transport

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-password-transport.yml'
      - 'app/build.sh'
      - 'app/main.swift'
      - 'app/VPNPassword*.swift'
      - 'app/VPNLegacyPasswordBackend.swift'
      - 'app/VPNStore.swift'
      - 'app/VPNConfiguration.swift'
      - 'tests/test_vpn_password_worker.py'
      - 'tests/vpn_password_worker_checks.swift'
      - 'tests/test_vpn_password_frontend.py'
      - 'tests/test_vpn_legacy_password_backend.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Signed frontend and synthetic worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic child and adapter only; no Keychain operations
        run: PYTHONPATH=tests python3 -m unittest test_vpn_password_worker test_vpn_legacy_password_backend -v
      - name: Genuine signed frontend closed roles; no GUI or credential API
        run: PYTHONPATH=tests python3 -m unittest test_vpn_password_frontend -v
