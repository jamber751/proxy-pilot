name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to prepare or finalize (e.g. v1.6.0)"
        required: true
      phase:
        description: "Prepare a draft or verify and publish its exact assets"
        required: true
        type: choice
        default: finalize
        options:
          - prepare
          - finalize

permissions:
  contents: write

concurrency:
  group: proxypilot-release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or finalize immutable release
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_PHASE: ${{ github.event_name == 'push' && 'prepare' || github.event.inputs.phase }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Validate tag, version and phase
        run: |
          VERSION=$(awk -F'"' '/^readonly PP_VERSION=/{print $2}' bin/proxypilot)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || {
            echo "::error::tag $RELEASE_TAG does not match PP_VERSION=$VERSION"; exit 1
          }
          [[ "$RELEASE_PHASE" == prepare || "$RELEASE_PHASE" == finalize ]] || {
            echo "::error::unknown release phase"; exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_TAG")" || {
            echo "::error::checkout is not the requested tag"; exit 1
          }

      - name: Build a non-published CI smoke package
        if: env.RELEASE_PHASE == 'prepare'
        run: ./make-dmg.sh

      - name: Regression tests with packaged GOST
        if: env.RELEASE_PHASE == 'prepare'
        env:
          PROXYPILOT_TEST_GOST: ${{ github.workspace }}/vendor/gost-universal
        run: python3 -m unittest discover -s tests -v

      - name: Verify CI smoke DMG
        if: env.RELEASE_PHASE == 'prepare'
        run: |
          VERSION=$(awk -F'"' '/^readonly PP_VERSION=/{print $2}' bin/proxypilot)
          DMG="dist/ProxyPilot-$VERSION.dmg"
          hdiutil verify "$DMG"
          MOUNT=$(mktemp -d /tmp/proxypilot-ci-dmg.XXXXXX)
          trap 'hdiutil detach "$MOUNT" -quiet >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -quiet -readonly -nobrowse -mountpoint "$MOUNT"
          APP="$MOUNT/ProxyPilot.app"
          test -x "$MOUNT/Install.command"
          test -f "$MOUNT/READ_ME_FIRST.txt"
          test -x "$APP/Contents/Resources/bin/proxypilot"
          test -x "$APP/Contents/Resources/bin/gost"
          test "$(lipo -archs "$APP/Contents/Resources/bin/gost")" = "x86_64 arm64" \
            || test "$(lipo -archs "$APP/Contents/Resources/bin/gost")" = "arm64 x86_64"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ProxyPilotVPNReleaseSequence' "$APP/Contents/Info.plist")" \
            = "$(tr -d '\n' < app/vpn-release-sequence.txt)"
          hdiutil detach "$MOUNT" -quiet

      - name: Create the draft only
        if: env.RELEASE_PHASE == 'prepare'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "::error::release is already published; use a new version"; exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ProxyPilot ${RELEASE_TAG#v}" \
              --notes-file .github/release-notes.md
          fi
          echo "Draft prepared. Upload the nine outputs of app/build-joint-release.sh without overwriting assets, then run phase=finalize."

      - name: Require an unpublished draft
        if: env.RELEASE_PHASE == 'finalize'
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
            echo "::error::finalize requires an existing draft"; exit 1
          }

      - name: Snapshot and download exact draft assets
        if: env.RELEASE_PHASE == 'finalize'
        run: |
          VERSION=${RELEASE_TAG#v}
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets | sort_by(.name)[] | [.id,.name,.size,.state,(.digest // "")] | @tsv' \
            > "$RUNNER_TEMP/assets-before.tsv"
          python3 app/verify-release-asset-snapshot.py --version "$VERSION" \
            --snapshot "$RUNNER_TEMP/assets-before.tsv"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          python3 app/verify-release-asset-snapshot.py --version "$VERSION" \
            --snapshot "$RUNNER_TEMP/assets-before.tsv" \
            --assets "$RUNNER_TEMP/release-assets"

      - name: Verify the complete release candidate
        if: env.RELEASE_PHASE == 'finalize'
        run: |
          VERSION=${RELEASE_TAG#v}
          zsh app/verify-release-candidate.sh "$VERSION" "$RUNNER_TEMP/release-assets"

      - name: Publish unchanged verified snapshot
        if: env.RELEASE_PHASE == 'finalize'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets | sort_by(.name)[] | [.id,.name,.size,.state,(.digest // "")] | @tsv' \
            > "$RUNNER_TEMP/assets-after.tsv"
          cmp "$RUNNER_TEMP/assets-before.tsv" "$RUNNER_TEMP/assets-after.tsv"
          gh release edit "$RELEASE_TAG" --draft=false --latest
