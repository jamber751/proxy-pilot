name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: proxypilot-release
  cancel-in-progress: false

jobs:
  dmg:
    name: Build and publish DMG
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Require update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::Set SPARKLE_PRIVATE_KEY (see docs/updates.md)"; exit 1; }

      - name: Check version matches the tag
        run: |
          TAG="$RELEASE_TAG"
          VERSION=$(awk -F'"' '/^readonly PP_VERSION=/{print $2}' bin/proxypilot)
          echo "  тег: $TAG   PP_VERSION: $VERSION"
          # расхождение здесь = релиз с чужим номером внутри; лучше упасть сейчас
          [[ "$TAG" == "v$VERSION" ]] || {
            echo "::error::тег $TAG не совпадает с PP_VERSION=$VERSION в bin/proxypilot"
            exit 1
          }

      - name: Build DMG
        run: ./make-dmg.sh

      - name: Regression tests with packaged GOST
        env:
          PROXYPILOT_TEST_GOST: ${{ github.workspace }}/vendor/gost-universal
        run: python3 -m unittest discover -s tests -v

      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: zsh app/sign-update.sh

      - name: Verify signed feed using real Sparkle
        run: |
          python3 -m unittest discover -s tests -p test_sparkle_feed.py -v
          python3 -m unittest discover -s tests -p test_update_controls.py -v

      - name: Test ad-hoc update installation and relaunch (disposable app)
        env:
          PROXYPILOT_TEST_INSTALLER: '1'
        run: python3 -m unittest discover -s tests -p test_sparkle_install.py -v

      - name: Verify DMG
        run: |
          VERSION=$(awk -F'"' '/^readonly PP_VERSION=/{print $2}' bin/proxypilot)
          DMG="dist/ProxyPilot-$VERSION.dmg"
          hdiutil verify "$DMG"
          hdiutil attach "$DMG" -quiet -mountpoint /tmp/ppdmg
          test -x /tmp/ppdmg/Install.command        || { echo "нет установщика"; exit 1; }
          test -f /tmp/ppdmg/READ_ME_FIRST.txt      || { echo "нет памятки"; exit 1; }
          BIN=/tmp/ppdmg/ProxyPilot.app/Contents/Resources/bin
          test -x "$BIN/proxypilot" && test -x "$BIN/gost" || { echo "бандл не самодостаточен"; exit 1; }
          echo "  gost: $(lipo -archs $BIN/gost)"
          lipo -archs "$BIN/gost" | grep -q x86_64 || { echo "gost не universal"; exit 1; }
          hdiutil detach /tmp/ppdmg -quiet

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION=$(awk -F'"' '/^readonly PP_VERSION=/{print $2}' bin/proxypilot)
          DMG="dist/ProxyPilot-$VERSION.dmg"
          ZIP="dist/updates/ProxyPilot-$VERSION.zip"
          FEED="dist/updates/appcast.xml"
          # Upload everything into a draft before exposing it to /latest.
          # Published signed releases are immutable; fix forward with a new tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo "::error::Release is already published; use a new version"; exit 1;
            }
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "ProxyPilot $VERSION" \
              --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" "$DMG" "$ZIP" "$FEED" --clobber
          gh release edit "$TAG" --draft=false --latest
