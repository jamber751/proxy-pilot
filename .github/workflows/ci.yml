name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell scripts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in bin/proxypilot install.sh make-dmg.sh; do
            zsh -n "$f" && echo "  ok  $f"
          done

      - name: CLI smoke test
        run: |
          # без конфига CLI обязан не падать, а объяснять, что делать
          ./bin/proxypilot version
          ./bin/proxypilot help >/dev/null
          ./bin/proxypilot doctor || true          # doctor выходит != 0, когда нечего настраивать
          ./bin/proxypilot probe 127.0.0.1:1 && exit 1 || echo "  ok  probe корректно сообщает down"
          # set валидирует ввод
          ./bin/proxypilot set BRIDGE_PORT 99 && exit 1 || echo "  ok  set отвергает битый порт"
          ./bin/proxypilot set BRIDGE_PORT 3129
          ./bin/proxypilot json | python3 -c 'import json,sys; json.load(sys.stdin)' && echo "  ok  json валиден"
          # сетевой профиль: статусы обязаны работать без root и без настроек
          ./bin/proxypilot net status >/dev/null && echo "  ok  net status"
          ./bin/proxypilot vpn status >/dev/null && echo "  ok  vpn status"
          ./bin/proxypilot net apply && exit 1 || echo "  ok  net apply требует root"
          ./bin/proxypilot set OFFICE_IP 999.1.1.1 && exit 1 || echo "  ok  set отвергает битый адрес"
          ./bin/proxypilot set VPN_AUTO maybe && exit 1 || echo "  ok  set отвергает битый VPN_AUTO"
          # конфиг разбирается без исполнения: команды net/vpn работают из-под root,
          # и строка в пользовательском файле не должна становиться root-командой
          printf 'OFFICE_IP=1.1.1.1\ntouch /tmp/pp-injection\n' > "${XDG_CONFIG_HOME:-$HOME/.config}/proxypilot/config"
          ./bin/proxypilot version >/dev/null
          test ! -e /tmp/pp-injection && echo "  ok  строка из конфига не исполняется"
          ./bin/proxypilot detect >/dev/null 2>&1 || true   # вернуть рабочий конфиг
          # значения с пробелами должны сохраняться в кавычках
          ./bin/proxypilot set OFFICE_DNS "1.1.1.1 8.8.8.8"
          grep -q 'OFFICE_DNS="1.1.1.1 8.8.8.8"' "${XDG_CONFIG_HOME:-$HOME/.config}/proxypilot/config" \
            && echo "  ok  список DNS сохранён в кавычках"

  app:
    name: App (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./app/build.sh

      - name: Verify bundle
        run: |
          APP=app/build/ProxyPilot.app
          BIN=$APP/Contents/MacOS/ProxyPilot
          archs=$(lipo -archs "$BIN")
          echo "  архитектуры: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "не universal"; exit 1; }
          minos=$(otool -l "$BIN" | awk '/minos/{print $2; exit}')
          echo "  minos: $minos"
          [[ "$minos" == "11.0" ]] || { echo "ожидалась планка macOS 11.0"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "нет иконки"; exit 1; }
          codesign --verify --verbose=1 "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyPilot.app
          path: app/build/ProxyPilot.app
          retention-days: 14
