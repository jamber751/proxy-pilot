name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell scripts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in bin/proxypilot install.sh make-dmg.sh; do
            zsh -n "$f" && echo "  ok  $f"
          done

      - name: CLI smoke test
        run: |
          # без конфига CLI обязан не падать, а объяснять, что делать
          ./bin/proxypilot version
          ./bin/proxypilot help >/dev/null
          ./bin/proxypilot doctor || true          # doctor выходит != 0, когда нечего настраивать
          ./bin/proxypilot probe 127.0.0.1:1 && exit 1 || echo "  ok  probe корректно сообщает down"
          # set валидирует ввод
          ./bin/proxypilot set BRIDGE_PORT 99 && exit 1 || echo "  ok  set отвергает битый порт"
          ./bin/proxypilot set BRIDGE_PORT 3129
          ./bin/proxypilot json | python3 -c 'import json,sys; json.load(sys.stdin)' && echo "  ok  json валиден"
          # сетевой профиль: статусы обязаны работать без root и без настроек
          ./bin/proxypilot net status >/dev/null && echo "  ok  net status"
          # маршруты для туннеля выводятся из офисной сети — считаются без root,
          # поэтому проверяемы: раньше здесь молча получалось «1» вместо префикса
          ./bin/proxypilot set OFFICE_GATEWAYS 192.168.8.
          ./bin/proxypilot vpn status | grep -q '192.168.0.0/16' \
            && echo "  ok  маршруты в туннель выведены из офисной сети"
          # маска считается из битов, а не таблицей: /14 и /32 не должны стать /24
          ./bin/proxypilot set VPN_ROUTES "10.20.0.0/14"
          ./bin/proxypilot vpn status | grep -q '10.20.0.0/14' \
            && echo "  ok  нестандартный префикс сохранён"
          ./bin/proxypilot set VPN_ROUTES ""
          # без OFFICE_GATEWAYS профиль не должен трогать ни адрес, ни туннель
          ./bin/proxypilot set OFFICE_GATEWAYS ""
          ./bin/proxypilot net --dry-run | grep -q 'ничего не трогаю' \
            && echo "  ok  без OFFICE_GATEWAYS профиль не вмешивается"
          ./bin/proxypilot set OFFICE_GATEWAYS 192.168.8.
          ./bin/proxypilot vpn status >/dev/null && echo "  ok  vpn status"
          ./bin/proxypilot net apply && exit 1 || echo "  ok  net apply требует root"
          ./bin/proxypilot set OFFICE_IP 999.1.1.1 && exit 1 || echo "  ok  set отвергает битый адрес"
          ./bin/proxypilot set VPN_AUTO maybe && exit 1 || echo "  ok  set отвергает битый VPN_AUTO"
          # конфиг разбирается без исполнения: команды net/vpn работают из-под root,
          # и строка в пользовательском файле не должна становиться root-командой
          printf 'OFFICE_IP=1.1.1.1\ntouch /tmp/pp-injection\n' > "${XDG_CONFIG_HOME:-$HOME/.config}/proxypilot/config"
          ./bin/proxypilot version >/dev/null
          test ! -e /tmp/pp-injection && echo "  ok  строка из конфига не исполняется"
          ./bin/proxypilot detect >/dev/null 2>&1 || true   # вернуть рабочий конфиг
          # значения с пробелами должны сохраняться в кавычках
          ./bin/proxypilot set OFFICE_DNS "1.1.1.1 8.8.8.8"
          grep -q 'OFFICE_DNS="1.1.1.1 8.8.8.8"' "${XDG_CONFIG_HOME:-$HOME/.config}/proxypilot/config" \
            && echo "  ok  список DNS сохранён в кавычках"
          # detect переписывает конфиг, но сетевой профиль и туннель обязан переносить,
          # а OFFICE_GATEWAYS (определение офиса) — не подменять текущей сетью: иначе
          # демон перестаёт управлять адресом или, хуже, ставит офисную статику дома.
          # Прокси для detect подсовываем сами: HTTP-листенер на адресе раннера
          # (loopback detect не берёт — защита от петли на собственный мост); отдаёт пустой каталог.
          IF=$(route -n get default | awk '/interface:/{print $2; exit}')
          MYIP=$(ipconfig getifaddr "$IF" || ifconfig "$IF" | awk '/inet /{print $2; exit}')
          python3 -m http.server 8080 --bind "$MYIP" --directory "$(mktemp -d)" >/dev/null 2>&1 &
          HTTPD=$!; sleep 1; kill -0 "$HTTPD" || { echo "FAIL: тестовый HTTP-листенер не поднялся на $MYIP:8080"; exit 1; }
          ./bin/proxypilot set HTTP_UPSTREAM "$MYIP:8080"
          ./bin/proxypilot set OFFICE_GATEWAYS 192.168.8.
          ./bin/proxypilot set OFFICE_IP 192.168.8.246
          touch /tmp/pp-fake.ovpn
          ./bin/proxypilot set VPN_PROFILE /tmp/pp-fake.ovpn
          ./bin/proxypilot set VPN_AUTO on
          ./bin/proxypilot detect >/dev/null
          kill "$HTTPD" 2>/dev/null || true
          CFG="${XDG_CONFIG_HOME:-$HOME/.config}/proxypilot/config"
          grep -qF "Создан 'proxypilot detect'" "$CFG" || { echo "FAIL: detect не переписал конфиг"; exit 1; }
          grep -qF "HTTP_UPSTREAM=$MYIP:8080" "$CFG" || { echo "FAIL: detect не нашёл тестовый прокси"; exit 1; }
          grep -qxF 'OFFICE_GATEWAYS=192.168.8.' "$CFG" || { echo "FAIL: detect подменил OFFICE_GATEWAYS: $(grep ^OFFICE_GATEWAYS= "$CFG")"; exit 1; }
          grep -qxF 'OFFICE_IP=192.168.8.246' "$CFG" && grep -qxF 'VPN_PROFILE=/tmp/pp-fake.ovpn' "$CFG" \
            && grep -qxF 'VPN_AUTO=on' "$CFG" && grep -qxF 'OFFICE_DNS="1.1.1.1 8.8.8.8"' "$CFG" \
            && echo "  ok  detect переносит сетевой профиль, туннель и OFFICE_GATEWAYS" || { echo "FAIL: detect потерял сетевой профиль"; exit 1; }
          # чистые функции: разбор ARP, квотирование конфига
          ./bin/proxypilot selftest

  app:
    name: App (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./app/build.sh

      - name: Verify bundle
        run: |
          APP=app/build/ProxyPilot.app
          BIN=$APP/Contents/MacOS/ProxyPilot
          archs=$(lipo -archs "$BIN")
          echo "  архитектуры: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "не universal"; exit 1; }
          minos=$(otool -l "$BIN" | awk '/minos/{print $2; exit}')
          echo "  minos: $minos"
          [[ "$minos" == "11.0" ]] || { echo "ожидалась планка macOS 11.0"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "нет иконки"; exit 1; }
          codesign --verify --verbose=1 "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyPilot.app
          path: app/build/ProxyPilot.app
          retention-days: 14
