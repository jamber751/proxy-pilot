name: VPN isolated ownership acceptance

on:
  push:
    branches: [codex/vpn-root-acceptance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    name: Root ownership (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # frozen executor regression reads a pinned historical blob
      - name: Ordinary destination regressions
        run: python3 -m unittest discover -s tests -p test_vpn_application_destination_exchange.py -v
      - name: Rescue authorization and pending journal boundaries
        run: PYTHONPATH=tests python3 -m unittest test_vpn_release_authorization test_vpn_rescue_authorization test_vpn_rescue_journal_context test_vpn_rescue_cleanup_context -v
      - name: Live rescue refuses ordinary users
        run: PYTHONPATH=tests python3 -m unittest test_vpn_rescue_executor.VPNRescueExecutorUnprivilegedTests -v
      - name: Protected live rescue identity
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env PROXYPILOT_VM_ROOT_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_executor.VPNRescueExecutorRootTests -v
      - name: Authorized rescue destination exchange
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env PROXYPILOT_VM_ROOT_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_exchange.VPNRescueExchangeRootTests -v
      - name: Pending rescue ordering and interrupted retries
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env PROXYPILOT_VM_ROOT_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_rescue_pending_coordinator.VPNRescuePendingCoordinatorRootTests -v
      - name: Root ownership in disposable fixture directories
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env PROXYPILOT_VM_ROOT_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_vpn_destination_root_vm.py -v
      - name: Source clone refuses ordinary users
        run: PYTHONPATH=tests python3 -m unittest test_vpn_legacy_source_clone.VPNLegacySourceCloneUnprivilegedTests -v
      - name: Private source clone with real ownership
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo -n env PROXYPILOT_VM_ROOT_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest test_vpn_legacy_source_clone.VPNLegacySourceCloneTests -v
