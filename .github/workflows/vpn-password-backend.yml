name: VPN disposable legacy password backend

on:
  push:
    branches: [codex/vpn-root-acceptance]
    paths:
      - '.github/workflows/vpn-password-backend.yml'
      - 'app/VPNLegacyPasswordBackend.swift'
      - 'app/VPNPasswordWorker*.swift'
      - 'app/VPNStore.swift'
      - 'app/VPNConfiguration.swift'
      - 'tests/test_vpn_legacy_password_backend*.py'
      - 'tests/vpn_legacy_password_backend*.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Private legacy backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Injected API regressions without Keychain operations
        run: PYTHONPATH=tests python3 -m unittest test_vpn_legacy_password_backend -v
      - name: Authenticated child with only fresh disposable private keychains
        env:
          PROXYPILOT_VM_PASSWORD_BACKEND_TESTS: '1'
        run: PYTHONPATH=tests python3 -m unittest test_vpn_legacy_password_backend_vm -v
